version: "3.8"

services:
  nats:
    image: nats:latest
    container_name: apg-nats
    ports:
      - "4222:4222"   # NATS client port
      - "8222:8222"   # NATS monitoring HTTP
    command: ["-js", "-m", "8222"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

